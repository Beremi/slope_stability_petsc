[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slope-codegen"
version = "0.1.0"
description = "Deterministic build-time generators for slope-stability"
requires-python = ">=3.12"
license = "BSD-2-Clause"
dependencies = []

[project.scripts]
slope-generate-protocol = "slope_codegen.protocol:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
